apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: grafana
      defaultDatabase: analytics
      dialTimeout: '10'
      queryTimeout: '30'
    secureJsonData:
      password: grafana-dev
