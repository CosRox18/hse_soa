name: soa-hw3
services:
  flight-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: flights
      POSTGRES_USER: flights
      POSTGRES_PASSWORD: ${FLIGHT_DB_PASSWORD:-flights-dev}
    volumes:
      - flight_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U flights -d flights']
      interval: 2s
      timeout: 3s
      retries: 30
  booking-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: bookings
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-bookings-dev}
    volumes:
      - booking_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bookings -d bookings']
      interval: 2s
      timeout: 3s
      retries: 30
  flight-migrate:
    image: redgate/flyway:11.15.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://flight-db:5432/flights
      FLYWAY_USER: flights
      FLYWAY_PASSWORD: ${FLIGHT_DB_PASSWORD:-flights-dev}
    volumes:
      - ./migrations/flight:/flyway/sql:ro
    depends_on:
      flight-db:
        condition: service_healthy
  booking-migrate:
    image: redgate/flyway:11.15.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://booking-db:5432/bookings
      FLYWAY_USER: bookings
      FLYWAY_PASSWORD: ${BOOKING_DB_PASSWORD:-bookings-dev}
    volumes:
      - ./migrations/booking:/flyway/sql:ro
    depends_on:
      booking-db:
        condition: service_healthy
  redis-master:
    image: redis:7.4-alpine
    command: [redis-server, --replica-announce-ip, redis-master]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  redis-replica:
    image: redis:7.4-alpine
    command: [redis-server, --replicaof, redis-master, '6379', --replica-announce-ip, redis-replica]
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  redis-sentinel:
    image: redis:7.4-alpine
    command: [sh, -c, 'test -f /data/sentinel.conf || cp /etc/sentinel.conf /data/sentinel.conf; exec redis-server /data/sentinel.conf --sentinel']
    volumes:
      - ./redis/sentinel.conf:/etc/sentinel.conf:ro
      - sentinel_data:/data
    depends_on:
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: [CMD, redis-cli, -p, '26379', ping]
      interval: 2s
      timeout: 2s
      retries: 30
  flight:
    build: .
    command: [python, -m, flight.server]
    environment:
      DATABASE_URL: postgresql://flights:${FLIGHT_DB_PASSWORD:-flights-dev}@flight-db:5432/flights
      GRPC_API_KEY: ${GRPC_API_KEY:-booking-flight-dev-key}
      REDIS_SENTINEL: redis-sentinel:26379
      CACHE_TTL_SECONDS: 300
    depends_on:
      flight-migrate:
        condition: service_completed_successfully
      redis-sentinel:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import socket; socket.create_connection(("localhost", 50051), 2).close()']
      interval: 2s
      timeout: 3s
      retries: 30
  booking:
    build: .
    command: [uvicorn, booking.main:app, --host, 0.0.0.0, --port, '8000']
    environment:
      DATABASE_URL: postgresql://bookings:${BOOKING_DB_PASSWORD:-bookings-dev}@booking-db:5432/bookings
      FLIGHT_ADDRESS: flight:50051
      GRPC_API_KEY: ${GRPC_API_KEY:-booking-flight-dev-key}
      GRPC_TIMEOUT_SECONDS: ${GRPC_TIMEOUT_SECONDS:-1}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-5}
      CB_OPEN_SECONDS: ${CB_OPEN_SECONDS:-10}
      CB_WINDOW_SECONDS: ${CB_WINDOW_SECONDS:-30}
    ports:
      - '127.0.0.1:${API_PORT:-18084}:8000'
    depends_on:
      booking-migrate:
        condition: service_completed_successfully
      flight:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  flight_data:
  booking_data:
  sentinel_data:
