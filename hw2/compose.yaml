name: soa-hw2
services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: redgate/flyway:11.15.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/marketplace
      FLYWAY_USER: marketplace
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://marketplace:${POSTGRES_PASSWORD}@db:5432/marketplace
      JWT_SECRET: ${JWT_SECRET:?Run python scripts/configure.py first}
      ORDER_INTERVAL_MINUTES: ${ORDER_INTERVAL_MINUTES:-1}
    ports:
      - "127.0.0.1:${API_PORT:-18082}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
