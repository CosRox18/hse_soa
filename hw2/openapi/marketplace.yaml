openapi: 3.0.3
info:
  title: Marketplace
  version: 1.0.0
security:
- bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      x-roles: []
      responses:
        '200':
          description: Успех
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
        '500': {$ref: '#/components/responses/InternalError'}
      security: []
  /auth/register:
    post:
      operationId: register
      x-roles: []
      responses:
        '201':
          description: Успех
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '409':
          description: 'USERNAME_TAKEN: Имя занято. '
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      security: []
  /auth/login:
    post:
      operationId: login
      x-roles: []
      responses:
        '200':
          description: Успех
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '401':
          description: 'TOKEN_INVALID: Невалидный access token или логин/пароль. '
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      security: []
  /auth/refresh:
    post:
      operationId: refresh
      x-roles: []
      responses:
        '200':
          description: Успех
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '401':
          description: 'REFRESH_TOKEN_INVALID: Невалидный refresh token. '
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      security: []
  /products:
    post:
      operationId: create_product
      description: 'Роли: SELLER, ADMIN'
      x-roles: [SELLER, ADMIN]
      responses:
        '201':
          description: Успех
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/TokenInvalidTokenExpired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductCreate'}
    get:
      operationId: list_products
      description: 'Роли: USER, SELLER, ADMIN'
      x-roles: [USER, SELLER, ADMIN]
      responses:
        '200':
          description: Успех
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductPage'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/TokenInvalidTokenExpired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
      parameters:
      - name: page
        in: query
        schema: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807, default: 0}
      - name: size
        in: query
        schema: {type: integer, format: int64, minimum: 1, maximum: 100, default: 20}
      - name: status
        in: query
        schema: {$ref: '#/components/schemas/ProductStatus'}
      - name: category
        in: query
        schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[^\x00]*$'}
  /products/{id}:
    get:
      operationId: get_product
      description: 'Роли: USER, SELLER, ADMIN'
      x-roles: [USER, SELLER, ADMIN]
      responses:
        '200':
          description: Успех
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/TokenInvalidTokenExpired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ProductNotFound'}
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
    put:
      operationId: update_product
      description: 'Роли: SELLER, ADMIN'
      x-roles: [SELLER, ADMIN]
      responses:
        '200':
          description: Успех
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/TokenInvalidTokenExpired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ProductNotFound'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductUpdate'}
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
    delete:
      operationId: archive_product
      description: 'Роли: SELLER, ADMIN'
      x-roles: [SELLER, ADMIN]
      responses:
        '204':
          description: Успех
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/TokenInvalidTokenExpired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ProductNotFound'}
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
  /orders:
    post:
      operationId: create_order
      description: 'Роли: USER, ADMIN'
      x-roles: [USER, ADMIN]
      responses:
        '201':
          description: Успех
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/TokenInvalidTokenExpired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '409':
          description: 'ORDER_HAS_ACTIVE: Есть активный заказ. PRODUCT_INACTIVE: Товар неактивен. INSUFFICIENT_STOCK: Недостаточный
            остаток. '
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429': {$ref: '#/components/responses/OrderLimitExceeded'}
        '404': {$ref: '#/components/responses/ProductNotFound'}
        '422': {$ref: '#/components/responses/PromoCodeInvalidPromoCodeMinAmount'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCreate'}
  /orders/{id}:
    get:
      operationId: get_order
      description: 'Роли: USER, ADMIN'
      x-roles: [USER, ADMIN]
      responses:
        '200':
          description: Успех
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/TokenInvalidTokenExpired'}
        '403': {$ref: '#/components/responses/AccessDeniedOrderOwnershipViolation'}
        '404': {$ref: '#/components/responses/OrderNotFound'}
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
    put:
      operationId: update_order
      description: 'Роли: USER, ADMIN'
      x-roles: [USER, ADMIN]
      responses:
        '200':
          description: Успех
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/TokenInvalidTokenExpired'}
        '403': {$ref: '#/components/responses/AccessDeniedOrderOwnershipViolation'}
        '404':
          description: 'ORDER_NOT_FOUND: Заказ не найден. PRODUCT_NOT_FOUND: Товар не найден. '
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: 'INVALID_STATE_TRANSITION: Недопустимое состояние. PRODUCT_INACTIVE: Товар неактивен. INSUFFICIENT_STOCK:
            Недостаточный остаток. '
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429': {$ref: '#/components/responses/OrderLimitExceeded'}
        '422': {$ref: '#/components/responses/PromoCodeInvalidPromoCodeMinAmount'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderUpdate'}
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
  /orders/{id}/cancel:
    post:
      operationId: cancel_order
      description: 'Роли: USER, ADMIN'
      x-roles: [USER, ADMIN]
      responses:
        '200':
          description: Успех
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/TokenInvalidTokenExpired'}
        '403': {$ref: '#/components/responses/AccessDeniedOrderOwnershipViolation'}
        '404': {$ref: '#/components/responses/OrderNotFound'}
        '409': {$ref: '#/components/responses/InvalidStateTransition'}
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
  /promo-codes:
    post:
      operationId: create_promo
      description: 'Роли: SELLER, ADMIN'
      x-roles: [SELLER, ADMIN]
      responses:
        '201':
          description: Успех
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PromoResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '401': {$ref: '#/components/responses/TokenInvalidTokenExpired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '409':
          description: 'PROMO_CODE_EXISTS: Промокод уже существует. '
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromoCreate'}
components:
  schemas:
    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ARCHIVED]
    OrderStatus:
      type: string
      enum: [CREATED, PAYMENT_PENDING, PAID, SHIPPED, COMPLETED, CANCELED]
    Role:
      type: string
      enum: [USER, SELLER, ADMIN]
    ProductCreate:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 255, pattern: '^[^\x00]*$'}
        description: {type: string, maxLength: 4000, nullable: true, pattern: '^[^\x00]*$'}
        price: {type: number, format: decimal, minimum: 0.01, maximum: 9999999999.99, multipleOf: 0.01}
        stock: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}
        category: {type: string, minLength: 1, maxLength: 100, pattern: '^[^\x00]*$'}
        status: {$ref: '#/components/schemas/ProductStatus'}
      required: [name, price, stock, category, status]
    ProductUpdate:
      allOf:
      - {$ref: '#/components/schemas/ProductCreate'}
    ProductResponse:
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        name: {type: string, minLength: 1, maxLength: 255, pattern: '^[^\x00]*$'}
        description: {type: string, maxLength: 4000, nullable: true, pattern: '^[^\x00]*$'}
        price: {type: number, format: decimal, minimum: 0.01, maximum: 9999999999.99, multipleOf: 0.01}
        stock: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}
        category: {type: string, minLength: 1, maxLength: 100, pattern: '^[^\x00]*$'}
        status: {$ref: '#/components/schemas/ProductStatus'}
        seller_id: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      required: [id, name, description, price, stock, category, status, seller_id, created_at, updated_at]
    ProductPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ProductResponse'}
        totalElements: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}
        page: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}
        size: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
      required: [items, totalElements, page, size]
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        username: {type: string, minLength: 1, maxLength: 100, pattern: '^[a-zA-Z0-9_]+$'}
        password: {type: string, minLength: 8, maxLength: 128, format: password}
      required: [username, password]
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username: {type: string, minLength: 1, maxLength: 100, pattern: '^[a-zA-Z0-9_]+$'}
        password: {type: string, minLength: 8, maxLength: 128, format: password}
      required: [username, password]
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token: {type: string, minLength: 1}
      required: [refresh_token]
    UserResponse:
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        username: {type: string}
        role: {$ref: '#/components/schemas/Role'}
      required: [id, username, role]
    TokenResponse:
      type: object
      additionalProperties: false
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type:
          type: string
          enum: [bearer]
      required: [access_token, refresh_token, token_type]
    OrderItemInput:
      type: object
      additionalProperties: false
      properties:
        product_id: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        quantity: {type: integer, format: int64, minimum: 1, maximum: 999}
      required: [product_id, quantity]
    OrderCreate:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItemInput'}
          minItems: 1
          maxItems: 50
        promo_code: {type: string, pattern: '^[A-Z0-9_]{4,20}$', nullable: true}
      required: [items]
    OrderUpdate:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItemInput'}
          minItems: 1
          maxItems: 50
      required: [items]
    OrderItemResponse:
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        product_id: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        quantity: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        price_at_order: {type: number, format: decimal, minimum: 0.01, maximum: 9999999999.99, multipleOf: 0.01}
      required: [id, product_id, quantity, price_at_order]
    OrderResponse:
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        user_id: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        status: {$ref: '#/components/schemas/OrderStatus'}
        promo_code_id: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807, nullable: true}
        total_amount: {type: number, format: decimal, minimum: 0, maximum: 9999999999.99, multipleOf: 0.01}
        discount_amount: {type: number, format: decimal, minimum: 0, maximum: 9999999999.99, multipleOf: 0.01}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItemResponse'}
      required: [id, user_id, status, promo_code_id, total_amount, discount_amount, created_at, updated_at, items]
    PromoCreate:
      type: object
      additionalProperties: false
      properties:
        code: {type: string, pattern: '^[A-Z0-9_]{4,20}$'}
        discount_type:
          type: string
          enum: [PERCENTAGE, FIXED_AMOUNT]
        discount_value: {type: number, format: decimal, minimum: 0.01, maximum: 9999999999.99, multipleOf: 0.01}
        min_order_amount: {type: number, format: decimal, minimum: 0, maximum: 9999999999.99, multipleOf: 0.01}
        max_uses: {type: integer, format: int64, minimum: 1, maximum: 2147483647}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        active: {type: boolean, default: true}
      required: [code, discount_type, discount_value, min_order_amount, max_uses, valid_from, valid_until]
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
      required: [status]
    PromoResponse:
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        code: {type: string, pattern: '^[A-Z0-9_]{4,20}$'}
        discount_type:
          type: string
          enum: [PERCENTAGE, FIXED_AMOUNT]
        discount_value: {type: number, format: decimal, minimum: 0.01, maximum: 9999999999.99, multipleOf: 0.01}
        min_order_amount: {type: number, format: decimal, minimum: 0, maximum: 9999999999.99, multipleOf: 0.01}
        max_uses: {type: integer, format: int64, minimum: 1, maximum: 2147483647}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        active: {type: boolean, default: true}
        current_uses: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}
      required: [id, code, discount_type, discount_value, min_order_amount, max_uses, valid_from, valid_until, active, current_uses]
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error_code:
          type: string
          enum: [PRODUCT_NOT_FOUND, PRODUCT_INACTIVE, ORDER_NOT_FOUND, ORDER_LIMIT_EXCEEDED, ORDER_HAS_ACTIVE, INVALID_STATE_TRANSITION,
            INSUFFICIENT_STOCK, PROMO_CODE_INVALID, PROMO_CODE_MIN_AMOUNT, ORDER_OWNERSHIP_VIOLATION, VALIDATION_ERROR, TOKEN_EXPIRED,
            TOKEN_INVALID, REFRESH_TOKEN_INVALID, ACCESS_DENIED, USERNAME_TAKEN, PROMO_CODE_EXISTS, INTERNAL_ERROR, HTTP_ERROR]
        message: {type: string}
        details: {type: object, additionalProperties: true, nullable: true}
      required: [error_code, message]
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  headers:
    RequestId:
      description: ID запроса
      schema: {type: string, format: uuid}
  responses:
    ValidationError:
      description: 'VALIDATION_ERROR: Невалидные входные данные.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InternalError:
      description: 'INTERNAL_ERROR: Внутренняя ошибка.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    TokenInvalidTokenExpired:
      description: 'TOKEN_INVALID: Невалидный access token или логин/пароль. TOKEN_EXPIRED: Access token истёк.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AccessDenied:
      description: 'ACCESS_DENIED: Недостаточно прав.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ProductNotFound:
      description: 'PRODUCT_NOT_FOUND: Товар не найден.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    OrderLimitExceeded:
      description: 'ORDER_LIMIT_EXCEEDED: Слишком частая операция.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PromoCodeInvalidPromoCodeMinAmount:
      description: 'PROMO_CODE_INVALID: Промокод недействителен. PROMO_CODE_MIN_AMOUNT: Не достигнута минимальная сумма.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AccessDeniedOrderOwnershipViolation:
      description: 'ACCESS_DENIED: Недостаточно прав. ORDER_OWNERSHIP_VIOLATION: Чужой заказ.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    OrderNotFound:
      description: 'ORDER_NOT_FOUND: Заказ не найден.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InvalidStateTransition:
      description: 'INVALID_STATE_TRANSITION: Недопустимое состояние.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
